<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor YouTube para MP3</title>
</head> 
<style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px;background-color:#f4f4f9; }
    .container { max-width: 500px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0,1); }
    input[type="text"] { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background-color: #ff0000; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #cc0000; }
</style>
<body>
    <div class="container">
    <h2>Conversor YouTube para MP3 🎵</h2>
    <form method="POST">
        <input type="text" name="url" placeholder="Cole o link do YouTube aqui..." required>
        <br>
        <button type="submit">Converter e Baixar</button>
    </form>
</div>
</body>
</html>
